name: 🔥NovaKernel MODIFIED Kernel Build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Target device"
        required: true
        type: choice
        options:
          - all
          - a73xq
          - a52sxq
          - m52xq

      kernelsu:
        description: "Enable KernelSU?"
        required: true
        type: boolean
        default: false

      ksu_repo:
        description: "KernelSU repo URL (overrides NK_KSU_REPO in buildscript)"
        required: false
        default: ""

      ksu_branch:
        description: "KernelSU branch"
        required: false
        type: choice
        default: "dev"
        options:
          - legacy
          - dev
          - custom

      ksu_branch_custom:
        description: "Custom branch name (only if ksu_branch = custom)"
        required: false
        default: ""

      hook_type:
        description: "KernelSU hook type (ignored if kernelsu = false)"
        required: false
        type: choice
        default: "kprobes"
        options:
          - kprobes
          - scope-min-1.6
          - rksu
          - syscall
          - inline

      backport:
        description: "Apply backport patches? (ignored if kernelsu = false)"
        required: false
        type: boolean
        default: false

      use_anykernel3:
        description: "Package with AnyKernel3? (false = raw image ZIP via magiskboot)"
        required: false
        type: boolean
        default: false

      debug:
        description: "SELinux permissive (debug build)"
        required: false
        type: boolean
        default: false

      upload_to_telegram:
        description: "Upload build to Telegram?"
        required: true
        type: boolean
        default: true

      release_type:
        description: "Release type"
        required: true
        type: choice
        default: "beta"
        options:
          - stable
          - beta

      changelog:
        description: "Build changelog / notes"
        required: false
        default: "No changelog provided"

concurrency:
  group: nova-build-${{ github.event.inputs.variant }}-${{ github.run_number }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: 🗂️ Prepare build matrix
        id: set-matrix
        shell: bash
        run: |
          case "${{ github.event.inputs.variant }}" in
            all)    echo 'matrix=["a73xq","a52sxq","m52xq"]' >> "$GITHUB_OUTPUT" ;;
            a73xq)  echo 'matrix=["a73xq"]'                  >> "$GITHUB_OUTPUT" ;;
            a52sxq) echo 'matrix=["a52sxq"]'                 >> "$GITHUB_OUTPUT" ;;
            m52xq)  echo 'matrix=["m52xq"]'                  >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown variant"; exit 1 ;;
          esac

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🚀 NovaKernel — Build Dispatch"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Variant    : ${{ github.event.inputs.variant }}"
          echo "  KernelSU   : ${{ github.event.inputs.kernelsu }}"
          echo "  KSU Branch : ${{ github.event.inputs.ksu_branch }}"
          echo "  Hook       : ${{ github.event.inputs.hook_type }}"
          echo "  Backport   : ${{ github.event.inputs.backport }}"
          echo "  AK3        : ${{ github.event.inputs.use_anykernel3 }}"
          echo "  Debug      : ${{ github.event.inputs.debug }}"
          echo "  Telegram   : ${{ github.event.inputs.upload_to_telegram }}"
          echo "  Triggered  : ${{ github.actor }}"
          echo "  Commit     : ${{ github.sha }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  build:
    needs: setup
    runs-on: ubuntu-24.04
    name: "🔨 Build (${{ matrix.device }})"

    strategy:
      matrix:
        device: ${{ fromJSON(needs.setup.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Install dependencies
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Installing build dependencies..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          sudo apt-get update -qq
          sudo apt-get install -y \
            git curl wget unzip tar lz4 zip patch \
            bc bison flex libssl-dev libelf-dev \
            python3 cpio rsync \
            make gcc g++ binutils
          echo "  ✔ Dependencies installed"

      - name: 💾 Setup swap (10 GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: 🔎 Detect clang version
        id: clangver
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Detecting clang version from buildscript"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          CLANGVER=$(grep -oP 'NK_CLANG_VERSION_DEFAULT="\K[^"]+' buildscript.sh || true)

          if [[ -z "$CLANGVER" ]]; then
            echo "::error::Failed to detect NK_CLANG_VERSION_DEFAULT from buildscript.sh"
            exit 1
          fi

          echo "Detected clang version: $CLANGVER"
          echo "version=$CLANGVER" >> "$GITHUB_OUTPUT"

      - name: 📂 Clang cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchains/${{ steps.clangver.outputs.version }}
          key: clang-${{ runner.os }}-${{ steps.clangver.outputs.version }}

      - name: 💡 Cache status
        shell: bash
        run: |
          if [[ "${{ steps.clang-cache.outputs.cache-hit }}" == "true" ]]; then
            echo "  ✔ Clang restored from cache"
          else
            echo "  ℹ No cache found — clang will download once"
          fi

      - name: 📂 Stock images cache
        id: img-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchains/images
          key: stock-images-v1

      - name: 💡 Image cache status
        shell: bash
        run: |
          if [[ "${{ steps.img-cache.outputs.cache-hit }}" == "true" ]]; then
            echo "  ✔ Stock images restored from cache"
          else
            echo "  ℹ Stock images not cached — will download"
          fi

      - name: 🔎 Resolve KernelSU repo
        id: ksu-repo
        if: ${{ fromJSON(github.event.inputs.kernelsu) == true }}
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.ksu_repo }}" ]]; then
            echo "repo=${{ github.event.inputs.ksu_repo }}" >> "$GITHUB_OUTPUT"
          else
            echo "repo=https://github.com/KernelSU-Next/KernelSU-Next.git" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔎 Resolve KernelSU branch
        id: ksu-branch
        if: ${{ fromJSON(github.event.inputs.kernelsu) == true }}
        shell: bash
        run: |
          if [[ "${{ github.event.inputs.ksu_branch }}" == "custom" ]]; then
            if [[ -z "${{ github.event.inputs.ksu_branch_custom }}" ]]; then
              echo "::error::ksu_branch_custom is empty while ksu_branch=custom"
              exit 1
            fi
            echo "branch=${{ github.event.inputs.ksu_branch_custom }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.event.inputs.ksu_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: ✅ Validate KernelSU branch exists
        if: ${{ fromJSON(github.event.inputs.kernelsu) == true }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ steps.ksu-repo.outputs.repo }}"
          BRANCH="${{ steps.ksu-branch.outputs.branch }}"

          echo "Checking branch '$BRANCH' on $REPO"
          if ! git ls-remote --exit-code --heads "$REPO" "$BRANCH" >/dev/null 2>&1; then
            echo "::error::KernelSU branch '$BRANCH' not found in $REPO"
            exit 1
          fi
          echo "✔ Branch '$BRANCH' exists in $REPO"

      - name: ⚡ KernelSU Setup
        if: ${{ fromJSON(github.event.inputs.kernelsu) == true }}
        timeout-minutes: 15
        env:
          NK_VARIANT:    ${{ matrix.device }}
          NK_KSU:        ${{ github.event.inputs.kernelsu }}
          NK_KSU_REPO:   ${{ steps.ksu-repo.outputs.repo }}
          NK_KSU_BRANCH: ${{ steps.ksu-branch.outputs.branch }}
          NK_HOOK_TYPE:  ${{ github.event.inputs.hook_type }}
          NK_BACKPORT:   ${{ github.event.inputs.backport }}
        shell: bash
        run: |
          chmod +x buildscript.sh
          ./buildscript.sh --phase ksu

      - name: 🩹 Inject SUSFS 2.1.0 for Kernel 5.4
        if: ${{ fromJSON(github.event.inputs.kernelsu) == true }}
        shell: bash
        run: |
          set -euo pipefail

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Injecting SUSFS 2.1.0 patch for Kernel 5.4"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          SUSFS_PATCH_URL="https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Patch/susfs_patch_to_5.4.patch"

          echo "Downloading SUSFS 5.4 patch..."
          curl -fL --retry 3 --retry-delay 2 -o /tmp/susfs_5.4.patch "$SUSFS_PATCH_URL"

          if [[ ! -s /tmp/susfs_5.4.patch ]]; then
            echo "::error::Downloaded SUSFS patch is empty"
            exit 1
          fi

          if ! head -n 5 /tmp/susfs_5.4.patch | grep -Eq '^(diff --git|--- )'; then
            echo "::error::Downloaded file is not a valid patch"
            sed -n '1,10p' /tmp/susfs_5.4.patch
            exit 1
          fi

          echo "Applying SUSFS patch to kernel..."
          patch -p1 < /tmp/susfs_5.4.patch

          echo "Verifying SUSFS files..."
          test -f fs/susfs.c || { echo "::error::fs/susfs.c not created by patch"; exit 1; }
          test -f include/linux/susfs.h || { echo "::error::include/linux/susfs.h not created"; exit 1; }

          echo "Checking symbol definition..."
          if ! grep -q 'susfs_extra_works' fs/susfs.c; then
            echo "::error::susfs_extra_works not defined in fs/susfs.c"
            exit 1
          fi

          echo "Ensuring fs/Makefile builds susfs.o..."
          if ! grep -q 'susfs\.o' fs/Makefile; then
            echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✔ SUSFS 2.1.0 injection complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✔ SUSFS 2.1.0 injection complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 🔍 SUSFS symbol sanity check
        if: ${{ fromJSON(github.event.inputs.kernelsu) == true }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking SUSFS symbol references..."
          grep -Rsn "susfs_extra_works" . || true

          if grep -Rqs "susfs_extra_works" KernelSU drivers 2>/dev/null; then
            echo "KernelSU side references susfs_extra_works"
          else
            echo "No KernelSU-side reference to susfs_extra_works found"
          fi

          if grep -Rqs "susfs_extra_works" fs include 2>/dev/null; then
            echo "Kernel source provides susfs_extra_works"
          else
            echo "::error::No susfs_extra_works provider found in fs/ or include/"
            exit 1
          fi

      - name: 🔨 Build kernel
        timeout-minutes: 60
        env:
          NK_VARIANT:        ${{ matrix.device }}
          NK_KSU:            ${{ github.event.inputs.kernelsu }}
          NK_KSU_REPO:       ${{ steps.ksu-repo.outputs.repo }}
          NK_KSU_BRANCH:     ${{ steps.ksu-branch.outputs.branch }}
          NK_HOOK_TYPE:      ${{ github.event.inputs.hook_type }}
          NK_BACKPORT:       ${{ github.event.inputs.backport }}
          USE_ANYKERNEL3:    ${{ github.event.inputs.use_anykernel3 }}
          DEBUG:             ${{ github.event.inputs.debug }}
        shell: bash
        run: |
          chmod +x buildscript.sh
          ./buildscript.sh --phase build

      - name: 🔍 Locate output ZIP
        id: find-zip
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.device }}" in
            a73xq)  DEVICE_DIR="A73"  ;;
            a52sxq) DEVICE_DIR="A52S" ;;
            m52xq)  DEVICE_DIR="M52"  ;;
            *) echo "::error::Unknown device"; exit 1 ;;
          esac

          ZIP=$(find "$HOME/toolchains/NovaKernel/$DEVICE_DIR" -type f -name "*.zip" | head -n1)

          if [[ -z "$ZIP" ]]; then
            echo "::error::No ZIP found for $DEVICE_DIR"
            exit 1
          fi

          ZIP_NAME=$(basename "$ZIP")
          ZIP_SIZE=$(du -sh "$ZIP" | cut -f1)
          ZIP_SHA=$(sha256sum "$ZIP" | awk '{print $1}')

          echo "zip_path=$ZIP"      >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  📦 Output ZIP"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Name   : $ZIP_NAME"
          echo "  Size   : $ZIP_SIZE"
          echo "  SHA256 : $ZIP_SHA"
          echo "  AK3    : ${{ github.event.inputs.use_anykernel3 }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: ⬆️ Upload artifact
        if: ${{ success() && steps.find-zip.outputs.zip_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find-zip.outputs.zip_name }}
          path: ${{ steps.find-zip.outputs.zip_path }}
          compression-level: 0

      - name: 📤 Upload to Telegram
        if: ${{ success() && github.event.inputs.upload_to_telegram == 'true' && steps.find-zip.outputs.zip_path != '' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
          CHANGELOG:    ${{ github.event.inputs.changelog }}
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.find-zip.outputs.zip_path }}"
          ZIP_NAME="${{ steps.find-zip.outputs.zip_name }}"
          DEVICE="${{ matrix.device }}"
          TYPE="${{ fromJSON(github.event.inputs.kernelsu) == true && 'KSU' || 'GKI' }}"
          HOOK="${{ github.event.inputs.hook_type }}"
          BACKPORT="${{ github.event.inputs.backport }}"
          RELEASE="${{ github.event.inputs.release_type }}"

          if [[ "$RELEASE" == "stable" ]]; then
            RELEASE_LABEL="✅ Stable"
          else
            RELEASE_LABEL="🧪 Beta"
          fi

          TIME=$(date +"%Y-%m-%d %H:%M")
          FULL_SHA="${{ github.sha }}"
          SHORT_SHA="${FULL_SHA:0:7}"
          REPO="${{ github.repository }}"
          COMMIT_LINK="<a href=\"https://github.com/${REPO}/commit/${FULL_SHA}\">${SHORT_SHA}</a>"

          if [[ "$TYPE" == "GKI" ]]; then
            CAPTION="$(printf '📦 <b>NovaKernel Build</b>\n\n📱 Device:    %s\n⚙️ Type:      %s\n🏷️ Release:   %s\n🕐 Time:      %s\n🔖 Commit:    %s\n\n📝 <b>Changelog:</b>\n%s' \
              "$DEVICE" "$TYPE" "$RELEASE_LABEL" "$TIME" "$COMMIT_LINK" "$CHANGELOG")"
          else
            CAPTION="$(printf '📦 <b>NovaKernel Build</b>\n\n📱 Device:    %s\n⚙️ Type:      %s\n🪝 Hook:      %s\n⬆️ Backport:  %s\n🏷️ Release:   %s\n🕐 Time:      %s\n🔖 Commit:    %s\n\n📝 <b>Changelog:</b>\n%s' \
              "$DEVICE" "$TYPE" "$HOOK" "$BACKPORT" "$RELEASE_LABEL" "$TIME" "$COMMIT_LINK" "$CHANGELOG")"
          fi

          echo "  📤 Sending to Telegram..."
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
            -F chat_id="$TG_CHAT_ID" \
            -F document=@"$ZIP;filename=$ZIP_NAME" \
            --form-string "caption=$CAPTION" \
            --form-string "parse_mode=HTML"
          echo "  ✔ Uploaded: $ZIP_NAME"

      - name: 📋 Write job summary
        if: ${{ always() }}
        shell: bash
        run: |
          ZIP="${{ steps.find-zip.outputs.zip_name }}"
          DEVICE="${{ matrix.device }}"
          TYPE="${{ fromJSON(github.event.inputs.kernelsu) == true && 'KSU' || 'GKI' }}"
          HOOK="${{ github.event.inputs.hook_type }}"
          BACKPORT="${{ github.event.inputs.backport }}"
          AK3="${{ github.event.inputs.use_anykernel3 }}"
          RELEASE="${{ github.event.inputs.release_type }}"

          if [[ "$RELEASE" == "stable" ]]; then
            RELEASE_LABEL="✅ Stable"
          else
            RELEASE_LABEL="🧪 Beta"
          fi

          CHANGELOG="${{ github.event.inputs.changelog }}"

          {
            echo "## 🚀 NovaKernel — \`$DEVICE\` [\`$TYPE\`]"
            echo ""
            echo "> ### 📝 Changelog"
            echo "> $CHANGELOG"
            echo ""
            echo "| Field | Value |"
            echo "|:------|:------|"
            echo "| 📱 Device     | \`$DEVICE\` |"
            echo "| 🏷️ Type       | \`$TYPE\` |"
            echo "| 🪝 Hook       | \`$HOOK\` |"
            echo "| ⬆️ Backport   | \`$BACKPORT\` |"
            echo "| 📦 AK3 Mode   | \`$AK3\` |"
            echo "| 🏷️ Release    | $RELEASE_LABEL |"
            echo "| 📦 Output     | \`${ZIP:-N/A}\` |"
            echo "| 🔖 Commit     | \`${{ github.sha }}\` |"
            echo "| 👤 Triggered  | @${{ github.actor }} |"
            echo "| 🕐 Time       | $(date '+%Y-%m-%d %H:%M:%S UTC') |"
          } >> "$GITHUB_STEP_SUMMARY"
