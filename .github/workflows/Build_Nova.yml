name: 🔥NovaKernel Kernel Build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Target device"
        required: true
        type: choice
        options:
          - all
          - a73xq
          - a52sxq
          - m52xq

      kernelsu:
        description: "Enable KernelSU?"
        required: true
        type: boolean
        default: false

      ksu_repo:
        description: "Custom KSU Repo URL (Leave empty for default)"
        required: false
        type: string
        default: ""

      ksu_branch:
        description: "KernelSU Branch (Type any branch name)"
        required: false
        type: string
        default: "legacy-susfs-v2"

      hook_type:
        description: "KernelSU hook type"
        required: false
        type: choice
        default: "kprobes"
        options:
          - kprobes
          - scope-min-1.6
          - rksu
          - syscall
          - inline

      backport:
        description: "Apply backport patches?"
        required: false
        type: boolean
        default: false

      use_ak3:
        description: "Package with AnyKernel3? (AK3 ZIP)"
        required: true
        type: boolean
        default: true

      debug:
        description: "SELinux permissive (debug build)"
        required: false
        type: boolean
        default: false

      upload_to_telegram:
        description: "Upload build to Telegram?"
        required: true
        type: boolean
        default: true

      changelog:
        description: "Build changelog / notes"
        required: false
        type: string
        default: "No changelog provided"

concurrency:
  group: nova-build-${{ github.event.inputs.variant }}-${{ github.run_number }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: 🗂️ Prepare build matrix
        id: set-matrix
        run: |
          if [[ "${{ github.event.inputs.variant }}" == "all" ]]; then
            echo 'matrix=["a73xq","a52sxq","m52xq"]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["${{ github.event.inputs.variant }}"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    runs-on: ubuntu-24.04
    name: "🔨 Build (${{ matrix.device }})"
    strategy:
      matrix:
        device: ${{ fromJSON(needs.setup.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git curl wget unzip tar lz4 zip patch \
            bc bison flex libssl-dev libelf-dev \
            python3 cpio rsync make gcc g++ binutils

      - name: 💾 Setup swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: 🔨 Run Build Pipeline
        env:
          NK_VARIANT:    ${{ matrix.device }}
          NK_KSU:        ${{ github.event.inputs.kernelsu }}
          NK_KSU_REPO:   ${{ github.event.inputs.ksu_repo }}
          NK_KSU_BRANCH: ${{ github.event.inputs.ksu_branch }}
          NK_HOOK_TYPE:  ${{ github.event.inputs.hook_type }}
          NK_BACKPORT:   ${{ github.event.inputs.backport }}
          NK_USE_AK3:    ${{ github.event.inputs.use_ak3 }}
          DEBUG:         ${{ github.event.inputs.debug }}
        run: |
          chmod +x buildscript.sh
          ./buildscript.sh

      - name: 🔍 Locate output ZIP
        id: find-zip
        run: |
          DEVICE_DIR=$(echo "${{ matrix.device }}" | sed 's/xq//' | tr 'a-z' 'A-Z')
          ZIP=$(find "$HOME/toolchains/NovaKernel/$DEVICE_DIR/ZIP" -name "*.zip" | head -n1)
          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find-zip.outputs.zip_name }}
          path: ${{ steps.find-zip.outputs.zip_path }}
          compression-level: 0

      - name: 📤 Upload to Telegram
        if: success() && github.event.inputs.upload_to_telegram == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
          CHANGELOG:    ${{ github.event.inputs.changelog }}
        run: |
          ZIP="${{ steps.find-zip.outputs.zip_path }}"
          ZIP_NAME="${{ steps.find-zip.outputs.zip_name }}"
          DEVICE="${{ matrix.device }}"
          TYPE="${{ github.event.inputs.kernelsu == 'true' && 'KSU' || 'GKI' }}"
          HOOK="${{ github.event.inputs.hook_type }}"
          AK3="${{ github.event.inputs.use_ak3 == 'true' && '✅ Yes' || '❌ No' }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TIME=$(date +"%Y-%m-%d %H:%M")

          CAPTION=$(printf "<b>🚀 NovaKernel — Build Ready!</b>\n\n")
          CAPTION="${CAPTION}<b>📱 Device:</b>  <code>$DEVICE</code>\n"
          CAPTION="${CAPTION}<b>⚙️ Type:</b>    <code>$TYPE</code>\n"
          [[ "$TYPE" == "KSU" ]] && CAPTION="${CAPTION}<b>🪝 Hook:</b>    <code>$HOOK</code>\n"
          CAPTION="${CAPTION}<b>📦 AnyKernel3:</b> $AK3\n"
          CAPTION="${CAPTION}<b>🔖 Commit:</b>   <a href=\"https://github.com/${{ github.repository }}/commit/${{ github.sha }}\">$SHORT_SHA</a>\n"
          CAPTION="${CAPTION}<b>🕒 Time:</b>     <i>$TIME</i>\n\n"
          CAPTION="${CAPTION}<b>📝 Changelog:</b>\n<blockquote>$CHANGELOG</blockquote>\n\n"
          CAPTION="${CAPTION}🛠 <i>Built via GitHub Actions</i>"

          echo "Uploading $ZIP_NAME to Telegram..."

          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
            -F chat_id="$TG_CHAT_ID" \
            -F document=@"$ZIP" \
            -F caption="$CAPTION" \
            -F parse_mode="HTML"